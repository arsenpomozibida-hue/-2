<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 2 — Завдання 1</title>
    <style>
        /* Світлий фон усього списку */
        ol {
            background-color: #e8a0af; /* рожеватий світлий фон */
            padding: 20px;
            width: 300px;
            list-style-position: inside;
        }

        /* Більш темний фон у кожного елемента списку */
        li {
            background-color: #c96879; /* середній відтінок */
            color: white;
            margin: 10px 0;
            padding: 5px 10px;
        }

        /* Найтемніший фон тільки під самим текстом */
        li span {
            background-color: #8c3846; /* темний фон */
            padding: 5px 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <ol>
        <li><span>Apple</span></li>
        <li><span>Orange</span></li>
        <li><span>Pineapple</span></li>
        <li><span>Pear</span></li>
        <li><span>Cherry</span></li>
    </ol>

</body>
</html>
